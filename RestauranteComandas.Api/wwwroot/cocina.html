<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Pantalla de Cocina</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        header {
            background: #dc2626;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .titulo {
            font-size: 28px;
            font-weight: bold;
        }

        .usuario {
            font-size: 14px;
            color: #fee2e2;
        }

        .btn-salir {
            background: #111827;
            color: white;
            border: 1px solid #fca5a5;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .estado-conexion {
            text-align: center;
            padding: 10px;
            background: #1f2937;
            font-size: 15px;
        }

        /* =============================================
           ALERTAS IMPORTANTES
           ============================================= */

        .alertas-cocina {
            padding: 0 20px;
        }

        .alerta-cocina {
            max-width: 760px;
            margin: 16px auto 0;
            border-radius: 14px;
            padding: 16px;
            color: #111827;
            box-shadow: 0 8px 22px rgba(0,0,0,.35);
        }

        .alerta-correccion {
            border: 5px solid #dc2626;
            background: #fee2e2;
            animation: alertaCorreccion 1s ease 3;
        }

        @keyframes alertaCorreccion {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.015);
            }
        }

        .alerta-cocina h2 {
            margin: 0 0 10px;
            color: #991b1b;
        }

        .alerta-mesa {
            margin-bottom: 10px;
            font-size: 17px;
        }

        .alerta-producto {
            margin: 10px 0;
            border: 2px solid #dc2626;
            border-radius: 10px;
            padding: 12px;
            background: white;
            color: #991b1b;
            font-size: 20px;
            font-weight: 900;
        }

        .alerta-cantidades {
            margin-top: 8px;
            line-height: 1.5;
        }

        .btn-entendido {
            width: 100%;
            margin-top: 12px;
            border: none;
            border-radius: 9px;
            padding: 12px;
            background: #111827;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: 900;
        }

        /* =============================================
           ÓRDENES
           ============================================= */

        .contenedor {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat( auto-fit, minmax( 320px, 1fr ) );
            gap: 20px;
        }

        .orden {
            background: #f9fafb;
            color: #111827;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 8px 18px rgba(0,0,0,.35);
            transition: transform .18s ease, box-shadow .18s ease;
        }

            .orden.con-novedad {
                border: 5px solid #f97316;
                box-shadow: 0 0 0 4px rgba(249,115,22,.20), 0 8px 18px rgba(0,0,0,.35);
                animation: destacarOrden 1.1s ease 2;
            }

        @keyframes destacarOrden {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.015);
            }
        }

        .orden h2 {
            margin-top: 0;
            color: #dc2626;
        }

        .estado {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #facc15;
            color: #111827;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .detalle {
            border-bottom: 1px solid #ddd;
            padding: 8px 0;
        }

            .detalle strong {
                font-size: 18px;
            }

        .nota {
            color: #dc2626;
            font-style: italic;
            margin-top: 4px;
        }

        /* =============================================
           NUEVOS PRODUCTOS
           ============================================= */

        .nuevos-productos {
            margin: 14px 0;
            border: 4px solid #f97316;
            border-radius: 12px;
            padding: 12px;
            background: #fff7ed;
        }

        .nuevos-productos-title {
            margin-bottom: 8px;
            color: #c2410c;
            font-size: 19px;
            font-weight: 900;
        }

        .nuevos-productos-hora {
            margin-top: 8px;
            color: #7c2d12;
            font-size: 12px;
            font-weight: 700;
        }

        .acciones {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-preparacion {
            background: #f97316;
            color: white;
        }

        .btn-listo {
            background: #22c55e;
            color: white;
        }

        .sin-ordenes {
            text-align: center;
            font-size: 22px;
            color: #d1d5db;
            margin-top: 40px;
        }

        .error {
            text-align: center;
            color: #fecaca;
            margin-top: 30px;
            font-size: 18px;
        }

        @media (max-width: 700px) {

            header {
                padding: 14px;
            }

            .titulo {
                font-size: 22px;
            }

            .alertas-cocina {
                padding: 0 12px;
            }

            .contenedor {
                grid-template-columns: 1fr;
                padding: 12px;
                gap: 14px;
            }

            .orden {
                padding: 14px;
            }
        }
    </style>

</head>

<body>

    <header>

        <div>

            <div class="titulo">
                Monitor de Cocina
            </div>

            <div class="usuario"
                 id="usuarioInfo"></div>

        </div>

        <div style="
                display:flex;
                gap:10px;
                flex-wrap:wrap;
            ">

            <button class="btn-salir"
                    onclick="volverPanel()">
                Panel
            </button>

            <button class="btn-salir"
                    onclick="cerrarSesion()">
                Cerrar sesión
            </button>

        </div>

    </header>

    <div class="estado-conexion"
         id="estadoConexion">
        Conectando con cocina...
    </div>

    <!--
        Las correcciones se muestran FUERA
        del listado de órdenes.

        De esta forma no desaparecen aunque
        el pedido estuviera marcado como Listo.
    -->

    <div class="alertas-cocina"
         id="alertasCocina"></div>

    <div class="contenedor"
         id="contenedorOrdenes"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

    <script>
        const token =
            localStorage.getItem(
                "token"
            );

        const usuarioNombre =
            localStorage.getItem(
                "usuarioNombre"
            );

        const usuarioRol =
            localStorage.getItem(
                "usuarioRol"
            );

        const contenedor =
            document.getElementById(
                "contenedorOrdenes"
            );

        const estadoConexion =
            document.getElementById(
                "estadoConexion"
            );

        const usuarioInfo =
            document.getElementById(
                "usuarioInfo"
            );

        const alertasCocina =
            document.getElementById(
                "alertasCocina"
            );

        validarSesion();

        usuarioInfo.innerText =
            `${usuarioNombre} - ${usuarioRol}`;

        const connection =
            new signalR
                .HubConnectionBuilder()
                .withUrl(
                    "/hubs/cocina",
                    {
                        accessTokenFactory:
                            () => token
                    }
                )
                .withAutomaticReconnect()
                .build();

        // =============================================
        // SIGNALR
        // =============================================

        connection.on(
            "ConexionExitosa",
            function (mensaje) {

                estadoConexion.innerText =
                    mensaje;
            }
        );

        connection.on(
            "NuevaOrden",
            function (orden) {

                agregarOrden(
                    orden
                );
            }
        );

        /*
         * Cuando llegan productos nuevos:
         * 1. actualizamos la orden completa;
         * 2. resaltamos específicamente lo nuevo.
         */
        connection.on(
            "ProductosAgregados",
            async function (data) {

                await cargarOrdenesPendientes();

                mostrarProductosAgregados(
                    data
                );
            }
        );

        /*
         * Corrección de un producto que ya
         * había sido enviado a Cocina.
         */
        connection.on(
            "OrdenCorregida",
            async function (data) {

                mostrarCorreccionPedido(
                    data
                );

                /*
                 * Recargamos para que las cantidades
                 * visibles del pedido coincidan con
                 * la base de datos.
                 */
                await cargarOrdenesPendientes();
            }
        );

        connection.on(
            "EstadoOrdenActualizado",
            function (data) {

                const estadoElemento =
                    document.getElementById(
                        `estado-${data.id}`
                    );

                if (estadoElemento) {

                    estadoElemento.innerText =
                        data.estado;
                }

                if (
                    data.estado === "Listo" ||
                    data.estado === "Pagado" ||
                    data.estado === "Cancelado"
                ) {

                    const ordenElemento =
                        document.getElementById(
                            `orden-${data.id}`
                        );

                    if (ordenElemento) {

                        ordenElemento.remove();
                    }
                }

                mostrarMensajeSinOrdenes();
            }
        );

        // =============================================
        // SESIÓN
        // =============================================

        function validarSesion() {

            if (!token) {

                window.location.href =
                    "/login.html";

                return;
            }

            if (
                usuarioRol !== "Cocina" &&
                usuarioRol !== "Administrador"
            ) {

                alert(
                    "No tiene permiso para acceder a la pantalla de cocina"
                );

                window.location.href =
                    "/login.html";
            }
        }

        function escaparHtml(texto) {

            return String(texto ?? "")
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );
        }

        // =============================================
        // CONEXIÓN
        // =============================================

        async function iniciarConexion() {

            try {

                await connection.start();

                estadoConexion.innerText =
                    "Conectado a cocina en tiempo real";

            } catch (err) {

                estadoConexion.innerText =
                    "Error de conexión. Reintentando...";

                setTimeout(
                    iniciarConexion,
                    3000
                );
            }
        }

        // =============================================
        // CARGAR PEDIDOS
        // =============================================

        async function cargarOrdenesPendientes() {

            try {

                const response =
                    await fetch(
                        "/api/Ordenes/pendientes",
                        {
                            method:
                                "GET",

                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );

                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.clear();

                    window.location.href =
                        "/login.html";

                    return;
                }

                if (!response.ok) {

                    contenedor.innerHTML = `
                            <div class="error">

                                No se pudieron cargar
                                las órdenes pendientes.

                            </div>
                        `;

                    return;
                }

                const ordenes =
                    await response.json();

                contenedor.innerHTML =
                    "";

                ordenes.forEach(
                    orden => {

                        agregarOrden(
                            orden
                        );
                    }
                );

                mostrarMensajeSinOrdenes();

            } catch (error) {

                contenedor.innerHTML = `
                        <div class="error">

                            Error de conexión
                            con el servidor.

                        </div>
                    `;
            }
        }

        // =============================================
        // CREAR HTML DETALLES
        // =============================================

        function crearDetallesHtml(
            detalles
        ) {

            return (
                detalles || []
            )
                .map(
                    detalle => `
                        <div class="detalle">

                            <strong>

                                ${detalle.cantidad}
                                x
                                ${escaparHtml(detalle.plato)}

                            </strong>

                            ${detalle.detallePersonalizado

                            ? `
                                    <div class="nota">

                                        Detalle:
                                        ${escaparHtml(detalle.detallePersonalizado)}

                                    </div>
                                  `

                            : ""
                        }

                        </div>
                    `
                )
                .join("");
        }

        // =============================================
        // MOSTRAR ORDEN
        // =============================================

        function agregarOrden(
            orden
        ) {

            const mensaje =
                document.querySelector(
                    ".sin-ordenes"
                );

            if (mensaje) {

                mensaje.remove();
            }

            const existente =
                document.getElementById(
                    `orden-${orden.id}`
                );

            if (existente) {

                existente.remove();
            }

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "orden";

            div.id =
                `orden-${orden.id}`;

            const detallesHtml =
                crearDetallesHtml(
                    orden.detalles
                );

            div.innerHTML = `
                    <h2>
                        Mesa ${orden.mesa}
                    </h2>

                    <div
                        class="estado"
                        id="estado-${orden.id}"
                    >
                        ${escaparHtml(orden.estado)}
                    </div>

                    <p>
                        <strong>
                            Orden:
                        </strong>

                        #${orden.id}
                    </p>

                    <p>
                        <strong>
                            Hora:
                        </strong>

                        ${new Date(orden.fecha).toLocaleTimeString()}
                    </p>

                    <div class="detalles-orden">

                        ${detallesHtml}

                    </div>

                    <div class="novedades-container"></div>

                    <div class="acciones">

                        <button
                            class="btn-preparacion"
                            onclick="actualizarEstado(${orden.id}, 'En preparación')"
                        >
                            En preparación
                        </button>

                        <button
                            class="btn-listo"
                            onclick="actualizarEstado(${orden.id}, 'Listo')"
                        >
                            Listo
                        </button>

                    </div>
                `;

            contenedor.prepend(
                div
            );

            mostrarMensajeSinOrdenes();
        }

        // =============================================
        // NUEVOS PRODUCTOS
        // =============================================

        function mostrarProductosAgregados(
            data
        ) {

            const ordenElemento =
                document.getElementById(
                    `orden-${data.id}`
                );

            if (!ordenElemento) {

                /*
                 * Si por cualquier razón no está,
                 * no se pierde la información:
                 * la siguiente recarga lo mostrará.
                 */
                return;
            }

            ordenElemento
                .classList
                .add(
                    "con-novedad"
                );

            const estadoElemento =
                document.getElementById(
                    `estado-${data.id}`
                );

            if (estadoElemento) {

                estadoElemento.innerText =
                    data.estado;
            }

            let novedadesContainer =
                ordenElemento
                    .querySelector(
                        ".novedades-container"
                    );

            if (!novedadesContainer) {

                novedadesContainer =
                    document.createElement(
                        "div"
                    );

                novedadesContainer.className =
                    "novedades-container";

                const acciones =
                    ordenElemento
                        .querySelector(
                            ".acciones"
                        );

                ordenElemento
                    .insertBefore(
                        novedadesContainer,
                        acciones
                    );
            }

            const bloque =
                document.createElement(
                    "div"
                );

            bloque.className =
                "nuevos-productos";

            bloque.innerHTML = `
                    <div class="nuevos-productos-title">

                        🆕 NUEVOS PRODUCTOS

                    </div>

                    ${crearDetallesHtml(data.detalles)}

                    <div class="nuevos-productos-hora">

                        Agregados a las
                        ${new Date(data.fecha).toLocaleTimeString()}

                    </div>
                `;

            novedadesContainer
                .prepend(
                    bloque
                );

            ordenElemento
                .scrollIntoView({
                    behavior:
                        "smooth",

                    block:
                        "center"
                });

            setTimeout(
                () => {

                    ordenElemento.style
                        .animation =
                        "none";
                },

                3000
            );
        }

        // =============================================
        // CORRECCIÓN DE PEDIDO
        // =============================================

        function mostrarCorreccionPedido(
            data
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "alerta-cocina alerta-correccion";

            const accionTexto =
                data.accion === "Eliminar"

                    ? "PRODUCTO CANCELADO"

                    : "CORRECCIÓN DE CANTIDAD";

            div.innerHTML = `
                    <h2>

                        ⚠️ ${accionTexto}

                    </h2>

                    <div class="alerta-mesa">

                        <strong>
                            Mesa ${data.mesa}
                        </strong>

                        ·

                        Pedido #${data.id}

                    </div>

                    <div class="alerta-producto">

                        🔴 RETIRAR:

                        ${data.cantidadAfectada}
                        ×
                        ${escaparHtml(data.plato)}

                    </div>

                    <div class="alerta-cantidades">

                        Cantidad anterior:

                        <strong>
                            ${data.cantidadAnterior}
                        </strong>

                        <br>

                        Cantidad correcta:

                        <strong>
                            ${data.cantidadNueva}
                        </strong>

                    </div>

                    <button
                        class="btn-entendido"
                        type="button"
                        onclick="this.parentElement.remove()"
                    >
                        Entendido
                    </button>
                `;

            alertasCocina
                .prepend(
                    div
                );

            div.scrollIntoView({
                behavior:
                    "smooth",

                block:
                    "center"
            });
        }

        // =============================================
        // ACTUALIZAR ESTADO
        // =============================================

        async function actualizarEstado(
            id,
            estado
        ) {

            try {

                const response =
                    await fetch(
                        `/api/Ordenes/${id}/estado`,
                        {
                            method:
                                "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`
                            },

                            body:
                                JSON.stringify(
                                    estado
                                )
                        }
                    );

                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    alert(
                        "No tiene permiso o la sesión expiró"
                    );

                    localStorage.clear();

                    window.location.href =
                        "/login.html";

                    return;
                }

                if (!response.ok) {

                    const error =
                        await response.text();

                    alert(
                        error ||
                        "No se pudo actualizar el estado"
                    );

                    return;
                }

            } catch (error) {

                alert(
                    "Error de conexión con el servidor"
                );
            }
        }

        function mostrarMensajeSinOrdenes() {

            const ordenes =
                document.querySelectorAll(
                    ".orden"
                );

            if (
                ordenes.length === 0 &&
                !document.querySelector(
                    ".sin-ordenes"
                )
            ) {

                contenedor.innerHTML = `
                        <div class="sin-ordenes">

                            No hay órdenes pendientes
                            por preparar.

                        </div>
                    `;
            }
        }

        function volverPanel() {

            window.location.href =
                "/panel.html";
        }

        function cerrarSesion() {

            localStorage.clear();

            window.location.href =
                "/login.html";
        }

        iniciarConexion();

        cargarOrdenesPendientes();

    </script>

</body>

</html>
