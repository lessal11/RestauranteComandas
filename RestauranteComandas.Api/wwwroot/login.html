<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Restaurante Comandas</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-container {
            background: #1f2937;
            padding: 35px;
            border-radius: 16px;
            width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.45);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #f87171;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #dc2626;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

            button:hover {
                background: #b91c1c;
            }

        .mensaje {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            color: #fca5a5;
        }

        .ok {
            color: #86efac;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>Restaurante</h1>

        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Ejemplo: cocina1">

        <label for="clave">Contraseña</label>
        <input type="password" id="clave" placeholder="Contraseña">

        <button onclick="login()">Ingresar</button>

        <div class="mensaje" id="mensaje"></div>
    </div>

    <script>
        async function login() {
            const usuario = document.getElementById("usuario").value.trim();
            const clave = document.getElementById("clave").value.trim();
            const mensaje = document.getElementById("mensaje");

            mensaje.innerText = "";
            mensaje.className = "mensaje";

            if (!usuario || !clave) {
                mensaje.innerText = "Ingrese usuario y contraseña";
                mensaje.classList.add("error");
                return;
            }

            try {
                const response = await fetch("/api/Usuarios/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nombreUsuario: usuario,
                        clave: clave
                    })
                });

                if (!response.ok) {
                    const error = await response.text();
                    mensaje.innerText = error || "Usuario o contraseña incorrectos";
                    mensaje.classList.add("error");
                    return;
                }

                const data = await response.json();

                localStorage.setItem("token", data.token);
                localStorage.setItem("usuarioNombre", data.usuario.nombre);
                localStorage.setItem("usuarioRol", data.usuario.rol);
                localStorage.setItem("usuarioId", data.usuario.id);

                mensaje.innerText = "Login correcto";
                mensaje.classList.add("ok");

                redirigirPorRol(data.usuario.rol);

            } catch (error) {
                mensaje.innerText = "Error de conexión con el servidor";
                mensaje.classList.add("error");
            }
        }

        function redirigirPorRol(rol) {
            window.location.href = "/panel.html";
        }

        document.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                login();
            }
        });
    </script>
</body>
</html>
