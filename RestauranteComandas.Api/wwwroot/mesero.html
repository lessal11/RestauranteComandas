<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Toma de Pedidos - Mesero</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #dc2626;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .titulo {
            font-size: 26px;
            font-weight: bold;
        }

        .usuario {
            font-size: 14px;
            color: #fee2e2;
        }

        .btn-salir {
            background: #111827;
            color: white;
            border: 1px solid #fca5a5;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            padding: 20px;
        }

        .panel {
            background: white;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 5px 14px rgba(0,0,0,0.12);
        }

        h2 {
            margin-top: 0;
            color: #dc2626;
        }

        .mesas {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .mesa {
            padding: 12px 18px;
            border-radius: 10px;
            border: 2px solid #d1d5db;
            background: #f9fafb;
            cursor: pointer;
            font-weight: bold;
        }

            .mesa.seleccionada {
                background: #dc2626;
                color: white;
                border-color: #dc2626;
            }

            .mesa.ocupada {
                background: #facc15;
                color: #111827;
                border-color: #eab308;
            }

        .categorias {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .categoria {
            padding: 10px 14px;
            border: none;
            border-radius: 20px;
            background: #e5e7eb;
            cursor: pointer;
            font-weight: bold;
        }

            .categoria.activa {
                background: #dc2626;
                color: white;
            }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .plato {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            background: #f9fafb;
        }

            .plato h3 {
                margin: 0 0 8px 0;
            }

        .precio {
            font-size: 18px;
            font-weight: bold;
            color: #16a34a;
            margin-bottom: 10px;
        }

        .detalle-input {
            width: 100%;
            padding: 9px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .cantidad-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }

            .cantidad-row input {
                width: 70px;
                padding: 8px;
                border: 1px solid #d1d5db;
                border-radius: 8px;
            }

        .btn-agregar {
            width: 100%;
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .carrito-item {
            border-bottom: 1px solid #e5e7eb;
            padding: 10px 0;
        }

            .carrito-item strong {
                display: block;
            }

        .nota {
            color: #dc2626;
            font-size: 13px;
            font-style: italic;
        }

        .subtotal {
            color: #16a34a;
            font-weight: bold;
        }

        .btn-eliminar {
            margin-top: 6px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 9px;
            border-radius: 6px;
            cursor: pointer;
        }

        .total {
            font-size: 24px;
            font-weight: bold;
            text-align: right;
            margin-top: 18px;
        }

        .btn-enviar {
            width: 100%;
            background: #dc2626;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

            .btn-enviar:disabled {
                background: #9ca3af;
                cursor: not-allowed;
            }

        .mensaje {
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
        }

        .ok {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <div>
            <div class="titulo">Toma de Pedidos</div>
            <div class="usuario" id="usuarioInfo"></div>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn-salir" onclick="volverPanel()">Panel</button>
            <button class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </header>

    <div class="layout">
        <div class="panel">
            <h2>Seleccionar mesa</h2>
            <div class="mesas" id="contenedorMesas"></div>

            <h2>Menú</h2>
            <div class="categorias" id="contenedorCategorias">
                <button class="categoria activa" onclick="filtrarCategoria('Todos', this)">Todos</button>
                <button class="categoria" onclick="filtrarCategoria('Sopas', this)">Sopas</button>
                <button class="categoria" onclick="filtrarCategoria('Ceviches', this)">Ceviches</button>
                <button class="categoria" onclick="filtrarCategoria('Fuertes', this)">Fuertes</button>
                <button class="categoria" onclick="filtrarCategoria('Especialidades', this)">Especialidades</button>
                <button class="categoria" onclick="filtrarCategoria('Antojitos', this)">Antojitos</button>
                <button class="categoria" onclick="filtrarCategoria('Jugos', this)">Jugos y Bebidas</button>
                <button class="categoria" onclick="filtrarCategoria('Adicionales', this)">Adicionales</button>
            </div>

            <div class="menu-grid" id="contenedorMenu"></div>
        </div>

        <div class="panel">
            <h2>Orden actual</h2>

            <div id="mesaSeleccionadaTexto">
                Mesa no seleccionada
            </div>

            <div id="contenedorCarrito"></div>

            <div class="total" id="totalTexto">
                Total: $0.00
            </div>

            <button class="btn-enviar" onclick="enviarOrden()">
                Enviar orden a cocina
            </button>

            <div class="mensaje" id="mensaje"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");
        const usuarioNombre = localStorage.getItem("usuarioNombre");
        const usuarioRol = localStorage.getItem("usuarioRol");

        const usuarioInfo = document.getElementById("usuarioInfo");
        const contenedorMesas = document.getElementById("contenedorMesas");
        const contenedorMenu = document.getElementById("contenedorMenu");
        const contenedorCarrito = document.getElementById("contenedorCarrito");
        const totalTexto = document.getElementById("totalTexto");
        const mensaje = document.getElementById("mensaje");
        const mesaSeleccionadaTexto = document.getElementById("mesaSeleccionadaTexto");

        let mesas = [];
        let menu = [];
        let categoriaActual = "Todos";
        let mesaSeleccionada = null;
        let carrito = [];

        validarSesion();

        usuarioInfo.innerText = `${usuarioNombre} - ${usuarioRol}`;

        function validarSesion() {
            if (!token) {
                window.location.href = "/login.html";
                return;
            }

            if (usuarioRol !== "Mesero" && usuarioRol !== "Administrador") {
                alert("No tiene permiso para acceder a la pantalla de mesero");
                window.location.href = "/login.html";
            }
        }

        async function cargarMesas() {
            try {
                const response = await fetch("/api/Mesas", {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.clear();
                    window.location.href = "/login.html";
                    return;
                }

                mesas = await response.json();
                renderizarMesas();

            } catch (error) {
                mostrarMensaje("Error al cargar mesas", "error");
            }
        }

        async function cargarMenu() {
            try {
                const response = await fetch("/api/Menu", {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    localStorage.clear();
                    window.location.href = "/login.html";
                    return;
                }

                menu = await response.json();
                renderizarMenu();

            } catch (error) {
                mostrarMensaje("Error al cargar menú", "error");
            }
        }

        function renderizarMesas() {
            contenedorMesas.innerHTML = "";

            mesas.forEach(mesa => {
                const btn = document.createElement("button");
                btn.className = "mesa";

                if (mesa.estado === "Ocupada") {
                    btn.classList.add("ocupada");
                }

                if (mesaSeleccionada && mesaSeleccionada.id === mesa.id) {
                    btn.classList.add("seleccionada");
                }

                btn.innerText = `Mesa ${mesa.numero}`;

                btn.onclick = function () {
                    mesaSeleccionada = mesa;
                    mesaSeleccionadaTexto.innerText = `Mesa seleccionada: ${mesa.numero}`;
                    renderizarMesas();
                };

                contenedorMesas.appendChild(btn);
            });
        }

        function renderizarMenu() {
            contenedorMenu.innerHTML = "";

            const itemsFiltrados = categoriaActual === "Todos"
                ? menu.filter(item => item.disponible)
                : menu.filter(item => item.categoria === categoriaActual && item.disponible);

            itemsFiltrados.forEach(item => {
                const div = document.createElement("div");
                div.className = "plato";

                div.innerHTML = `
                    <h3>${item.nombre}</h3>
                    <div>${item.categoria}</div>
                    <div class="precio">$${Number(item.precio).toFixed(2)}</div>

                    <div class="cantidad-row">
                        <label>Cantidad:</label>
                        <input type="number" id="cantidad-${item.id}" value="1" min="1">
                    </div>

                    <input class="detalle-input" id="detalle-${item.id}" placeholder="Detalle: sin cebolla, sin azúcar...">

                    <button class="btn-agregar" onclick="agregarAlCarrito(${item.id})">
                        Agregar
                    </button>
                `;

                contenedorMenu.appendChild(div);
            });
        }

        function filtrarCategoria(categoria, boton) {
            categoriaActual = categoria;

            document.querySelectorAll(".categoria").forEach(btn => {
                btn.classList.remove("activa");
            });

            boton.classList.add("activa");

            renderizarMenu();
        }

        function agregarAlCarrito(menuItemId) {
            const item = menu.find(x => x.id === menuItemId);

            if (!item) {
                mostrarMensaje("Plato no encontrado", "error");
                return;
            }

            const cantidadInput = document.getElementById(`cantidad-${menuItemId}`);
            const detalleInput = document.getElementById(`detalle-${menuItemId}`);

            const cantidad = parseInt(cantidadInput.value);
            const detallePersonalizado = detalleInput.value.trim();

            if (cantidad <= 0 || isNaN(cantidad)) {
                mostrarMensaje("La cantidad debe ser mayor a 0", "error");
                return;
            }

            carrito.push({
                menuItemId: item.id,
                nombre: item.nombre,
                precio: Number(item.precio),
                cantidad: cantidad,
                detallePersonalizado: detallePersonalizado
            });

            cantidadInput.value = 1;
            detalleInput.value = "";

            renderizarCarrito();
            mostrarMensaje("Plato agregado a la orden", "ok");
        }

        function renderizarCarrito() {
            contenedorCarrito.innerHTML = "";

            carrito.forEach((item, index) => {
                const subtotal = item.precio * item.cantidad;

                const div = document.createElement("div");
                div.className = "carrito-item";

                div.innerHTML = `
                    <strong>${item.cantidad} x ${item.nombre}</strong>
                    <div>Precio: $${item.precio.toFixed(2)}</div>
                    <div class="subtotal">Subtotal: $${subtotal.toFixed(2)}</div>
                    ${item.detallePersonalizado ? `<div class="nota">Detalle: ${item.detallePersonalizado}</div>` : ""}
                    <button class="btn-eliminar" onclick="eliminarItem(${index})">Eliminar</button>
                `;

                contenedorCarrito.appendChild(div);
            });

            actualizarTotal();
        }

        function eliminarItem(index) {
            carrito.splice(index, 1);
            renderizarCarrito();
        }

        function actualizarTotal() {
            const total = carrito.reduce((sum, item) => {
                return sum + (item.precio * item.cantidad);
            }, 0);

            totalTexto.innerText = `Total: $${total.toFixed(2)}`;
        }

        async function enviarOrden() {
            limpiarMensaje();

            if (!mesaSeleccionada) {
                mostrarMensaje("Debe seleccionar una mesa", "error");
                return;
            }

            if (carrito.length === 0) {
                mostrarMensaje("Debe agregar al menos un plato", "error");
                return;
            }

            const dto = {
                mesaId: mesaSeleccionada.id,
                detalles: carrito.map(item => ({
                    menuItemId: item.menuItemId,
                    cantidad: item.cantidad,
                    detallePersonalizado: item.detallePersonalizado
                }))
            };

            try {
                const response = await fetch("/api/Ordenes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(dto)
                });

                if (response.status === 401 || response.status === 403) {
                    alert("No tiene permiso o la sesión expiró");
                    localStorage.clear();
                    window.location.href = "/login.html";
                    return;
                }

                if (!response.ok) {
                    const error = await response.text();
                    mostrarMensaje(error || "No se pudo crear la orden", "error");
                    return;
                }

                const data = await response.json();

                mostrarMensaje(`Orden #${data.ordenId} enviada correctamente a cocina`, "ok");

                carrito = [];
                mesaSeleccionada = null;
                mesaSeleccionadaTexto.innerText = "Mesa no seleccionada";
                renderizarCarrito();

                await cargarMesas();

            } catch (error) {
                mostrarMensaje("Error de conexión con el servidor", "error");
            }
        }

        function mostrarMensaje(texto, tipo) {
            mensaje.innerText = texto;
            mensaje.className = `mensaje ${tipo}`;
        }

        function limpiarMensaje() {
            mensaje.innerText = "";
            mensaje.className = "mensaje";
        }

        function volverPanel() {
            window.location.href = "/panel.html";
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/login.html";
        }

        cargarMesas();
        cargarMenu();
    </script>
</body>
</html>
